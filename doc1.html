<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防空攔截 - 戰術射擊模擬 (多關卡版)</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        #ui {
            text-align: center;
            margin-bottom: 10px;
        }
        #game-image {
            max-width: 200px; /* 限制圖片最大寬度 */
            height: auto; /* 保持長寬比 */
            margin-bottom: 15px; /* 圖片與標題之間的距離 */
            border-radius: 8px; /* 圖片圓角 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* 圖片陰影 */
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #38bdf8;
        }
        p {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="ui">
        <!-- 加入指定圖片 -->
        <img id="game-image" src="https://i.meee.com.tw/JtpgEjE.jpg" alt="遊戲主題圖">
        <h1>防空攔截任務</h1>
        <p>控制方式：【← / →】鍵移動 | 【空白鍵】發射防空砲 / 勝利時下一關 | 【R】鍵重新開始</p>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲狀態變數
        let score = 0;
        let gameOver = false;
        let victory = false;
        let currentLevel = 1; // 初始關卡
        let animationId;

        // 關卡配置：不同關卡的速度與射擊機率
        const levelConfigs = {
            1: { baseEnemySpeed: 0.5, shootProbability: 0.0001 }, // 很慢，很少射擊
            2: { baseEnemySpeed: 0.8, shootProbability: 0.0003 }, // 稍快，稍多射擊
            3: { baseEnemySpeed: 1.2, shootProbability: 0.0007 }, // 中等
            4: { baseEnemySpeed: 1.5, shootProbability: 0.0010 }, // 正常 (接近原版)
            5: { baseEnemySpeed: 2.0, shootProbability: 0.0015 }, // 快速，密集射擊
            6: { baseEnemySpeed: 2.5, shootProbability: 0.0020 }  // 極速挑戰
        };

        // 按鍵追蹤
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') keys.Space = true;
            if (e.key.toLowerCase() === 'r') {
                if (gameOver || victory) initGame(1); // 如果結束或勝利，按 R 鍵重新開始第 1 關
            }
            if (e.code === 'Space' && victory) {
                nextLevel(); // 勝利時按空白鍵進入下一關
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // 玩家物件 (防空砲)
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 40,
            width: 50,
            height: 20,
            speed: 6,
            color: '#4ade80', // 亮綠色
            cooldown: 0,
            maxCooldown: 15 // 射擊間隔幀數
        };

        // 陣列儲存實體
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];

        // 敵軍參數
        const enemyRows = 5;
        const enemyCols = 11;
        const enemyWidth = 40;
        const enemyHeight = 25;
        const enemyPadding = 15;
        const enemyOffsetTop = 50;
        const enemyOffsetLeft = 80;
        
        let enemyDirection = 1; // 1向右, -1向左
        let baseEnemySpeed = 1.5;
        let currentEnemySpeed = baseEnemySpeed;

        // 初始化遊戲或關卡
        function initGame(level) {
            currentLevel = level;
            const config = levelConfigs[currentLevel] || levelConfigs[Object.keys(levelConfigs).length]; // 超過最後一關則使用最後一關
            
            if (level === 1) score = 0; // 如果是第 1 關，重置分數
            gameOver = false;
            victory = false;
            bullets = [];
            enemyBullets = [];
            enemies = [];
            
            player.x = canvas.width / 2 - player.width / 2;
            enemyDirection = 1;
            baseEnemySpeed = config.baseEnemySpeed; // 使用配置的速度
            currentEnemySpeed = baseEnemySpeed;

            for (let r = 0; r < enemyRows; r++) {
                for (let c = 0; c < enemyCols; c++) {
                    let enemyX = enemyOffsetLeft + c * (enemyWidth + enemyPadding);
                    let enemyY = enemyOffsetTop + r * (enemyHeight + enemyPadding);
                    // 根據列數給予不同顏色
                    let color = r < 2 ? '#ef4444' : (r < 4 ? '#f59e0b' : '#3b82f6');
                    enemies.push({ x: enemyX, y: enemyY, width: enemyWidth, height: enemyHeight, color: color, points: (5 - r) * 10 });
                }
            }
        }

        // 進入下一關
        function nextLevel() {
            initGame(currentLevel + 1);
        }

        // 碰撞偵測 (AABB)
        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.width || 
                     r2.x + r2.width < r1.x || 
                     r2.y > r1.y + r1.height ||
                     r2.y + r2.height < r1.y);
        }

        // 更新遊戲邏輯
        function update() {
            if (gameOver || victory) return;

            // 獲取當前關卡配置
            const config = levelConfigs[currentLevel] || levelConfigs[Object.keys(levelConfigs).length];

            // 玩家移動
            if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
            if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;

            // 玩家射擊
            if (player.cooldown > 0) player.cooldown--;
            if (keys.Space && player.cooldown === 0) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 15,
                    speed: 8,
                    color: '#facc15' // 黃色曳光彈
                });
                player.cooldown = player.maxCooldown;
            }

            // 更新玩家子彈
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // 敵軍移動邏輯
            let moveDown = false;
            let maxRight = 0;
            let minLeft = canvas.width;

            // 動態難度：敵人越少速度越快，基礎速度由關卡決定
            let speedMultiplier = 1 + ((enemyRows * enemyCols - enemies.length) / (enemyRows * enemyCols)) * 1.5;
            currentEnemySpeed = baseEnemySpeed * speedMultiplier;

            enemies.forEach(enemy => {
                enemy.x += currentEnemySpeed * enemyDirection;
                if (enemy.x + enemy.width > maxRight) maxRight = enemy.x + enemy.width;
                if (enemy.x < minLeft) minLeft = enemy.x;
            });

            // 觸碰邊界時反轉並下移
            if (maxRight > canvas.width - 20 || minLeft < 20) {
                enemyDirection *= -1;
                moveDown = true;
            }

            // 更新敵軍反擊與下移
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                if (moveDown) enemy.y += 20;

                // 隨機投擲炸彈，機率與關卡和動態難度掛鉤
                let currentShootProbability = config.shootProbability * speedMultiplier;
                if (Math.random() < currentShootProbability) {
                    enemyBullets.push({
                        x: enemy.x + enemy.width / 2 - 2,
                        y: enemy.y + enemy.height,
                        width: 4,
                        height: 12,
                        speed: 4,
                        color: '#f43f5e'
                    });
                }

                // 檢查敵軍是否觸地
                if (enemy.y + enemy.height >= player.y) {
                    gameOver = true;
                }
            }

            // 更新敵軍子彈
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].speed;
                
                // 玩家被擊中
                if (rectIntersect(enemyBullets[i], player)) {
                    gameOver = true;
                }

                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                }
            }

            // 碰撞判定：玩家子彈擊中敵軍
            for (let i = bullets.length - 1; i >= 0; i--) {
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (rectIntersect(bullets[i], enemies[j])) {
                        score += enemies[j].points;
                        enemies.splice(j, 1);
                        hit = true;
                        break;
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }

            // 勝利判定
            if (enemies.length === 0) {
                victory = true;
            }
        }

        // 繪製畫面
        function draw() {
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製玩家
            ctx.fillStyle = player.color;
            // 畫一個簡單的砲塔形狀
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(player.x + player.width/2 - 5, player.y - 10, 10, 10);

            // 繪製敵人
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                // 簡單的機翼造型
                ctx.fillRect(enemy.x, enemy.y + 10, enemy.width, enemy.height - 10);
                ctx.fillRect(enemy.x + 10, enemy.y, enemy.width - 20, 10);
            });

            // 繪製玩家子彈
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // 繪製敵軍子彈
            enemyBullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });

            // 繪製關卡與分數
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`關卡: ${currentLevel}`, 20, 30);
            ctx.fillText(`戰果積分: ${score}`, 20, 60);

            // 繪製結束/勝利畫面
            if (gameOver || victory) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = victory ? '#4ade80' : '#ef4444';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                if (victory) {
                    ctx.fillText(`關卡 ${currentLevel} 任務完成！敵機全數殲滅`, canvas.width / 2, canvas.height / 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px Arial';
                    ctx.fillText('按下【空白鍵】開始下一關', canvas.width / 2, canvas.height / 2 + 50);
                    ctx.fillText('按下【R】鍵重新開始第 1 關', canvas.width / 2, canvas.height / 2 + 80);
                } else {
                    ctx.fillText('任務失敗！防線遭突破', canvas.width / 2, canvas.height / 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px Arial';
                    ctx.fillText('按下【R】鍵重新開始第 1 關', canvas.width / 2, canvas.height / 2 + 50);
                }
            }
        }

        // 主遊戲迴圈
        function gameLoop() {
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // 啟動遊戲 (從第 1 關開始)
        initGame(1);
        gameLoop();
    </script>
</body>
</html>
